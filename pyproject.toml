[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jep-cli"
version = "0.7.2"
description = "Command-line client for JEP Core 0.7 with explicit legacy compatibility"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "HJS Spec", email = "signal@humanjudgment.org" }
]
requires-python = ">=3.9"
dependencies = ["rfc8785==0.1.4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
jep = "jep_cli.main:main"

[project.urls]
Homepage = "https://github.com/hjs-spec/cli"
Repository = "https://github.com/hjs-spec/cli"
Issues = "https://github.com/hjs-spec/cli/issues"

[tool.setuptools.packages.find]
include = ["jep_cli*"]
